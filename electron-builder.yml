appId: com.developerconcepts.vieweditor
productName: Homecut
copyright: Copyright © 2026 Steve Vaubell
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/ffmpeg-ffprobe-static/ffmpeg*
  - node_modules/ffmpeg-ffprobe-static/ffprobe*
extraResources:
  - from: licenses
    to: licenses
# Mac builds swap in an FFmpeg that may be passed on. The script explains why.
beforePack: scripts/mac-ffmpeg.mjs
# Where installed copies look for new versions (src/main/updater.ts). Builds still don't upload anything
# themselves: the Release workflow attaches the latest*.yml and .blockmap files written next to the installers.
publish:
  provider: github
  owner: SteveDeveloperConcepts
  repo: ViewEditor

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # No spaces in release file names: GitHub renames uploads that have them.
  artifactName: Homecut-Setup-${version}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.video
  # The disk image is what people download. Updates install from the zip.
  target:
    - dmg
    - zip
  artifactName: Homecut-${version}-${arch}.${ext}
  # The Release workflow signs the apps with a Developer ID and has Apple notarise them (docs/RELEASING.md).
  # electron-builder notarises when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
  # Builds without the certificate use build/adhoc-mac.yml.
  hardenedRuntime: true
  # Gatekeeper only accepts the apps once they're notarised, which comes after signing. The Release
  # workflow checks them then.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signs the apps as electron-builder would, except that FFmpeg gets build/entitlements.ffmpeg.plist,
  # which allows nothing. The script explains why.
  sign: scripts/sign-mac.mjs
  extendInfo:
    NSCameraUsageDescription: Homecut uses the camera when you record yourself.
    NSMicrophoneUsageDescription: Homecut uses the microphone when you record a voice-over or a video.
dmg:
  sign: false
